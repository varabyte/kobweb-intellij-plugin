<body>
This action will convert your CssStyle to use a more relaxed notation, which is useful if you plan to grow your
CssStyle block, e.g., with pseudo-selectors or additional CSS rules.
<pre><code>
// Before
CssStyle.base {
    Modifier
}

// After
CssStyle {
    base {
        Modifier
    }
}
</code></pre>
<!-- tooltip end -->
</body>
</html>

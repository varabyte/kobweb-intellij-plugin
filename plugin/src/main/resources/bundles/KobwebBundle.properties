inspection.conflicting.layout.annotations.display.name=Conflicting layout annotations
inspection.conflicting.layout.annotations.display.text=A page can't be annotated with both `@Layout` and `@NoLayout`. Please remove one of them.
inspection.invalid.route.display.name=Invalid page route
inspection.invalid.route.misplaced.display.text=Inferred (`{}`), catch-all (`{...}`), and optional (`{?}`) dynamic segments are only allowed at the end of a route.
inspection.invalid.route.package.mapping.misplaced.display.text=Package mappings can't use catch-all (`{...}`) or optional (`{?}`) dynamic segments, as a package is never at the end of a route.
inspection.invalid.route.package.mapping.misplaced.inferred.display.text=Only the last segment of a package mapping can be an inferred dynamic segment (`{}`). Please name the others explicitly.
inspection.invalid.route.malformed.display.text=`{0}` isn''t a valid dynamic segment. Dynamic segments look like `'{'name'}'`, `'{'name?'}'`, `'{'...name'}'`, or `'{'...name?'}'` (or `'{}'` to infer the name). Names can only contain letters, digits, `-`, and `_`.
inspection.invalid.route.stray.curly.braces.display.text=`{0}` has curly braces but isn''t a dynamic segment. Dynamic segments look like `'{'name'}'`, `'{'name?'}'`, `'{'...name'}'`, or `'{'...name?'}'` (or `'{}'` to infer the name). To use curly braces literally, percent-encode them as `%7B` and `%7D`.
inspection.invalid.route.dot.segment.display.text=`{0}` is a relative path segment, which browsers remove from URLs, so the route can never match.
inspection.invalid.route.empty.segment.display.text=Routes can't contain empty segments.
inspection.invalid.route.invalid.character.display.text=`{0}` contains characters which can''t be part of a URL path as is: {1}. To include them in the URL, write their percent-encoded value instead.
inspection.invalid.route.package.mapping.slash.display.text=Package mappings are expected to be a single route segment, without slashes.
inspection.invalid.route.outside.pages.package.display.text=Pages must be declared under the pages package (`{0}`), unless their route override is absolute (i.e. starts with a slash).
inspection.invalid.route.reserved.api.display.text=This page''s route ("{0}") starts with "api", which Kobweb reserves for API routes, so it will fail the build. Please choose another route.
inspection.invalid.route.repeated.dynamic.names.display.text=This page''s route ("{0}") uses the dynamic segment name(s) {1} more than once, so only one of the values can be read. Please rename one of them.
inspection.invalid.route.package.mapping.blank.display.text=Package mappings can't be blank. To change the route of a package's pages, move them to a different package instead.
inspection.invalid.route.package.mapping.duplicate.display.text=A package can only be mapped once, but `{0}` is also mapped in {1}.
inspection.invalid.route.package.mapping.outside.pages.package.display.text=Package mappings must be declared under the pages package (`{0}`).
inspection.disallowed.route.destination.display.name=Disallowed route destination
inspection.disallowed.route.destination.page.display.text=This route leads to a page, which isn't allowed here.
inspection.disallowed.route.destination.resource.display.text=This route leads to a resource, which isn't allowed here.
inspection.invalid.api.path.format.display.name=Invalid API path format
inspection.invalid.api.path.format.full.url.display.text=Only a path relative to "/api/", such as "auth/login", is expected here, not a full URL.
inspection.invalid.api.path.format.stream.full.url.display.text=Only the path of an API stream, such as "chat", is expected here, not a full URL.
inspection.invalid.api.path.format.stream.query.display.text=Only the path of an API stream, such as "chat", is expected here, without query parameters or a fragment.
inspection.invalid.route.format.display.name=Invalid route format
inspection.invalid.route.format.full.url.display.text=Only a path within the site, such as "/some/page", is expected here, not a full URL.
inspection.invalid.route.format.query.display.text=Only a path, such as "/some/page", is expected here, without query parameters or a fragment.
inspection.redirected.page.display.name=Redirected page
inspection.redirected.page.display.text=This page is never shown, as a redirect in .kobweb/conf.yaml sends its route ("{0}") to "{1}".
inspection.redirected.route.display.name=Redirected route
inspection.redirected.route.display.text=This route may be out of date, as .kobweb/conf.yaml redirects it to "{0}".
inspection.redundant.route.display.name=Redundant page route
inspection.redundant.route.override.display.text=Kobweb would generate the same route ("{0}") without this override, so it''s redundant.
inspection.redundant.route.package.mapping.display.text=Kobweb would use this name for the package anyway, so this package mapping is redundant.
inspection.redundant.route.shorten.display.text=Can be simplified to "{0}", which Kobweb expands to the same route.
inspection.unknown.api.path.display.name=Unknown API path
inspection.unknown.api.path.display.text=This path doesn't correspond to any known API endpoint.
inspection.unknown.api.path.api.prefix.display.text=API paths are already prefixed with "/api/", so it shouldn't be included here.
inspection.unknown.api.path.stream.display.text=This path doesn't correspond to any known API stream.
inspection.unknown.route.display.name=Unknown page route
inspection.unknown.route.display.text=This route doesn't correspond to any known page or public resource.


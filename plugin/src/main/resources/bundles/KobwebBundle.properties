inspection.invalid.layout.path.display.name=Invalid layout path
inspection.invalid.layout.path.not.found.display.text=No layout method found at `{0}`.
inspection.invalid.layout.path.missing.on.page.display.text=A `@Layout` annotation on a page must specify the path of a layout. (To opt a page out of a default layout, use `@NoLayout` instead.)
inspection.invalid.layout.path.missing.on.file.display.text=A `@file:Layout` annotation must specify the path of a layout.
inspection.invalid.default.layout.display.name=Invalid default layout
inspection.invalid.default.layout.outside.pages.package.display.text=Default layouts must be declared under the pages package (`{0}`).
inspection.invalid.default.layout.duplicate.display.text=A package can only be given one default layout, but `{0}` is also given one in {1}.

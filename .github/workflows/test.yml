name: Run Kobweb IntelliJ Plugin Tests

# Note that tests are also run via the verify workflow, which are triggered automatically in multiple relevant
# conditions. This non-verify version is provided only for manual dispatching.
on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: false
          large-packages: false

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Run tests
        run: ./gradlew :plugin:prepareTestSandbox :plugin:test

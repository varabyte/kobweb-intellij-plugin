name: Verify Kobweb IntelliJ Plugin Compatibility

on:
  push:
    branches:
      - dev
  workflow_dispatch:
  release:
    types:
      - published

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Maximize build space
        uses: jlumbroso/free-disk-space@v2.0.0
        with:
          preinstalled-runtimes: false
          large-packages: false

      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run tests
        run: ./gradlew :plugin:prepareTestSandbox :plugin:test

      - name: Verify Kobweb IntelliJ Plugin
        id: verify
        run: ./gradlew :plugin:verifyPlugin

      - name: Upload verifier reports
        # Upload even (especially!) when verification fails, but not if an earlier step (e.g. tests) failed
        if: ${{ !cancelled() && steps.verify.conclusion != 'skipped' }}
        uses: actions/upload-artifact@v7
        with:
          name: plugin-verifier-reports
          path: plugin/build/reports/pluginVerifier
          if-no-files-found: warn
          retention-days: 1
